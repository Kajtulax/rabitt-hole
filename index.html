g Ea-nasir's house in Ur found a whole stash of complaint tablets. He appears to have kept them. The original now sits in the British Museum."},{cat:"space",wiki:"Voyager Golden Record",title:"Voyager is carrying a mixtape to nobody in particular",body:"Both Voyager probes carry a gold-plated record with greetings in 55 languages, birdsong, a Chuck Berry track and the brainwaves of a woman in love.",deeper:"Voyager 1 will not pass near another star for about 40,000 years. The record is engraved with instructions for playing it, and the odds it is ever found are effectively zero. It was made anyway."},{cat:"earth",wiki:"Pando (tree)",title:"One of Earth's largest organisms is a forest",body:"In Utah, roughly 47,000 quaking aspen trunks are not a forest of individuals. They are one male tree sharing a single root system, cloning itself over and over.",deeper:"Pando covers about 43 hectares and may be thousands of years old. It is also dying: deer eat the young shoots faster than they can grow, so almost nothing has replaced the ageing trunks."},{cat:"art",wiki:"Voynich manuscript",title:"There is a book nobody has ever read",body:"The Voynich manuscript is 240 pages of flowing script in an unknown alphabet, illustrated with plants that do not exist and women bathing in green channels.",deeper:"Carbon dating puts the parchment in the early 1400s. Codebreakers who cracked wartime military ciphers have failed on it, and the text has statistical structure resembling real language."},{cat:"space",wiki:"Laniakea Supercluster",title:"The galaxy is falling toward something we cannot see",body:"The Milky Way is being pulled at around 600 km/s toward a region called the Great Attractor, hidden behind the crowded dust of our own galactic plane.",deeper:"We sit in a supercluster mapped in 2014 and named Laniakea, Hawaiian for 'immeasurable heaven'. It holds around 100,000 galaxies, bounded not by a shape but by which way everything flows."}].map(e=>({...e,id:"s"+e.wiki,source:"se
