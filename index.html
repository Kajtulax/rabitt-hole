n for ten days. Some came back alive, and some of those laid healthy eggs.",deeper:"They expel nearly all their water and curl into a glassy state called a tun, replacing water with sugars that hold their cell structures in place. Add water years later and the animal resumes."},{cat:"art",wiki:"Vantablack",title:"One artist owns the rights to the blackest black",body:"Vantablack absorbs almost all visible light, so objects coated in it look like holes cut out of reality. In 2016, Anish Kapoor secured exclusive rights to use it as an artistic material.",deeper:"Stuart Semple retaliated with a fluorescent 'Pinkest Pink' that anyone could buy except Kapoor, who had to declare at checkout that he was not Anish Kapoor. Kapoor got some anyway."},{cat:"space",wiki:"Neptune",title:"It probably rains diamonds on Neptune",body:"Deep inside Neptune and Uranus, crushing pressure squeezes methane until the carbon separates out and crystallises. Those diamonds then sink slowly toward the core.",deeper:"In 2017 researchers recreated the conditions with a laser and watched nanodiamonds form. The falling diamonds may release heat, which could explain why Neptune radiates more energy than it receives."},{cat:"earth",wiki:"Natural nuclear fission reactor",title:"A nuclear reactor switched itself on two billion years ago",body:"At Oklo in Gabon, uranium deposits went critical entirely on their own and sustained fission reactions for hundreds of thousands of years.",deeper:"Uranium was naturally more enriched then, and groundwater acted as a moderator. The reaction heated the water until it boiled away, shut down, cooled, and restarted hours later."},{cat:"history",wiki:"Complaint tablet to Ea-nasir",title:"The oldest customer complaint is about bad copper",body:"A clay tablet from around 1750 BCE carries a furious letter from a man named Nanni to a merchant called Ea-nasir, accusing him of delivering inferior copper ingots.",deeper:"Archaeologists excavating Ea-nasir's house in Ur found a whole stash of complaint tablets. He appears to have kept them. The original now sits in the British Museum."},{cat:"space",wiki:"Voyager Golden Record",title:"Voyager is carrying a mixtape to nobody in particular",body:"Both Voyager probes carry a gold-plated record with greetings in 55 languages, birdsong, a Chuck Berry track and the brainwaves of a woman in love.",deeper:"Voyager 1 will not pass near another star for about 40,000 years. The record is engraved with instructions for playing it, and the odds it is ever found are effectively zero. It was made anyway."},{cat:"earth",wiki:"Pando (tree)",title:"One of Earth's largest organisms is a forest",body:"In Utah, roughly 47,000 quaking aspen trunks are not a forest of individuals. They are one male tree sharing a single root system, cloning itself over and over.",deeper:"Pando covers about 43 hectares and may be thousands of years old. It is also dying: deer eat the young shoots faster than they can grow, so almost nothing has replaced the ageing trunks."},{cat:"art",wiki:"Voynich manuscript",title:"There is a book nobody has ever read",body:"The Voynich manuscript is 240 pages of flowing script in an unknown alphabet, illustrated with plants that do not exist and women bathing in green channels.",deeper:"Carbon dating puts the parchment in the early 1400s. Codebreakers who cracked wartime military ciphers have failed on it, and the text has statistical structure resembling real language."},{cat:"space",wiki:"Laniakea Supercluster",title:"The galaxy is falling toward something we cannot see",body:"The Milky Way is being pulled at around 600 km/s toward a region called the Great Attractor, hidden behind the crowded dust of our own galactic plane.",deeper:"We sit in a supercluster mapped in 2014 and named Laniakea, Hawaiian for 'immeasurable heaven'. It holds around 100,000 galaxies, bounded not by a shape but by which way everything flows."}].map(e=>({...e,id:"s"+e.wiki,source:"seed",url:"https://en.wikipedia
